# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

source = ~/.config/hypr/myColors.conf

monitor=HDMI-A-1, 3840x2160@120, 0x0, 1, bitdepth, 10, cm, hdr

# keywords / variables - see https://wiki.hyprland.org/Configuring/Keywords/
$terminal = kitty
$fileManager = thunar
$menu = rofi -show combi -modes combi -combi-modes "window,drun,run" -show-icons -matching fuzzy -theme ~/.config/rofi/tokyonight.rasi
$wallpaper = rofi -no-config -theme fullscreen-preview.rasi -show filebrowser -filebrowser-command 'awww img ' -filebrowser-directory "~/pictures/wallpaper" -filebrowser-sorting-method mtime -selected-row 1 >/dev/null

# autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = waybar
exec-once = awww-daemon
exec-once = dunst

# environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

general {
    gaps_in = 0
    gaps_out = 0

    border_size = 2

    col.active_border = $active_border_gradient
    col.inactive_border = $inactive_border_gradient

    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = false
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true # You probably want this
    default_split_ratio = 1.5
    force_split = 2
}

master {
    new_status = inherit
    orientation = center
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
	kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    numlock_by_default = true
    touchpad {
        natural_scroll = false
    }
}

cursor {
    hide_on_key_press = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# keybindings
$mainMod = SUPER

# applications
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, C, exec, google-chrome-stable
bind = $mainMod, Z, exec, zen-browser
bind = $mainMod, V, exec, vivaldi
bind = $mainMod, E, exec, emacsclient -c
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, $wallpaper
bind = $mainMod, S, exec, bash -c 'grim -g "$(slurp)" - | wl-copy'

# window manager
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit, # dwindle
bind = $mainMod, apostrophe, exec, hyprctl keyword general:layout master
bind = $mainMod SHIFT, apostrophe, exec, hyprctl keyword general:layout dwindle

# move focus with mainmod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# switch workspaces with mainmod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# move active window to a workspace with mainmod + shift + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# swap
bind = $mainMod CTRL, s, layoutmsg, swapsplit

# resize
bind = $mainMod SHIFT, right, resizeactive, 10 0
bind = $mainMod SHIFT, left, resizeactive, -10 0
bind = $mainMod SHIFT, up, resizeactive, 0 -10
bind = $mainMod SHIFT, down, resizeactive, 0 10

# example special workspace (scratchpad)
bind = $mainMod, X, togglespecialworkspace, magic
bind = $mainMod SHIFT, X, movetoworkspace, special:magic

# scroll through existing workspaces with mainmod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# move/resize windows with mainmod + lmb/rmb and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# laptop multimedia keys for volume and lcd brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# windows and workspaces
windowrule = suppress_event maximize, match:class .*
windowrule = no_blur on, match:class ^()$, match:title ^()$
windowrule = opacity 1 override 1 override 1 override, match:class kitty
windowrule = workspace 2, match:class google-chrome
windowrule = workspace 2, match:class zen
windowrule = workspace 2, match:class vivaldi-stable
windowrule = float on, match:class zen, match:title Picture-in-Picture
windowrule = workspace 3, match:class Emacs
windowrule = workspace 4, match:class jetbrains-idea-ce
windowrule = workspace 5, match:class steam
windowrule = workspace 9, match:class Bitwarden
